<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Coach</title>
<style>
  :root {
    --bg: #0a0c12;
    --panel: #12151e;
    --text: #e6e9f2;
    --muted: #8d93a8;
    --accent: #00b4b4;
    --hit: #159a3c;
    --miss: #d42020;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 'Segoe UI', Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid rgba(255,255,255,.08); flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 600; }
  #title { color: var(--accent); }
  #status { color: var(--muted); flex: 1; min-width: 200px; }
  #conn { font-size: 12px; color: var(--muted); }
  #conn.live::before { content: '● '; color: var(--hit); }
  #conn.down::before { content: '● '; color: var(--miss); }
  main { flex: 1; display: flex; align-items: center; padding: 16px 0; min-height: 0; }
  #strip { width: 100%; height: min(420px, 100%); border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(8,10,16,.88); }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  footer { display: flex; gap: 18px; padding: 10px 20px; color: var(--muted); font-size: 12px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,.08); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .heat { display: inline-block; width: 60px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; background: linear-gradient(90deg, hsl(120,85%,55%), hsl(60,85%,55%), hsl(0,85%,55%)); }
</style>
</head>
<body>
<header>
  <h1>Piano Coach · <span id="title">no score yet</span></h1>
  <div id="status">Ask Claude to show a score or start a practice run.</div>
  <div id="conn" class="down">connecting…</div>
</header>
<main><div id="strip"><iframe id="sheet" src="notation.html" title="Sheet music"></iframe></div></main>
<footer>
  <span><i class="sw" style="background:#00a6b8"></i>Play next</span>
  <span><i class="sw" style="background:var(--hit)"></i>Hit</span>
  <span><i class="sw" style="background:var(--miss)"></i>Missed</span>
  <span><i class="heat"></i>Bar heat map: clean → most problems</span>
</footer>
<script>
"use strict";
const frame = document.getElementById('sheet');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const connEl = document.getElementById('conn');

let frameLoaded = false, scoreReady = false, queue = [], scoreVersion = 0;

frame.addEventListener('load', () => { frameLoaded = true; if (scoreVersion) loadScore(scoreVersion); });
window.addEventListener('message', e => {
  if (e.source !== frame.contentWindow || !e.data) return;
  if (e.data.type === 'ready') {
    scoreReady = true;
    queue.forEach(m => frame.contentWindow.postMessage(m, '*'));
    queue = [];
  } else if (e.data.type === 'error') {
    statusEl.textContent = 'Sheet music error: ' + e.data.msg;
  }
});

function forward(msg) {
  if (scoreReady) frame.contentWindow.postMessage(msg, '*');
  else queue.push(msg);
}

async function loadScore(version) {
  scoreReady = false;
  queue = queue.filter(m => m.type !== 'marks' && m.type !== 'heat');
  if (!frameLoaded) return;
  try {
    const res = await fetch('score', {cache: 'no-store'});
    const payload = await res.json();
    if (payload.version !== version) return;  // a newer score arrived meanwhile
    frame.contentWindow.postMessage({type: 'loadScore', xml: payload.xml}, '*');
  } catch (err) {
    statusEl.textContent = 'Could not load score: ' + err;
  }
}

function connect() {
  const es = new EventSource('events');
  es.onopen = () => { connEl.textContent = 'connected'; connEl.className = 'live'; };
  es.onerror = () => { connEl.textContent = 'reconnecting… (is Claude Desktop running?)'; connEl.className = 'down'; };
  es.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'score') {
      titleEl.textContent = msg.title;
      document.title = 'Piano Coach · ' + msg.title;
      if (msg.version !== scoreVersion) { scoreVersion = msg.version; loadScore(msg.version); }
      return;
    }
    if (msg.type === 'status') { statusEl.textContent = msg.text; return; }  // shown in the header
    forward(msg);
  };
}
connect();
</script>
</body>
</html>
